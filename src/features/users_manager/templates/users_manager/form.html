{% extends "base.html" %}

{% block title %}{{ title }} | Lumini{% endblock %}
{% block main_class %}manager-page{% endblock %}

{% block content %}
<section class="manager-shell narrow-shell">
    <a class="back-link" href="{% url 'users-manager:dashboard' %}">Voltar para organizações e turmas</a>
    <div class="card manager-form-card">
        <div class="manager-heading">
            <p class="section-kicker">Gestão</p>
            <h1>{{ title }}</h1>
        </div>
        <form method="post">
            {% csrf_token %}
            {% include 'components/forms/fields.html' %}
            <button class="button form-submit" type="submit">Salvar</button>
        </form>
    </div>
</section>
{% endblock %}
