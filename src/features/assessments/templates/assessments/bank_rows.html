{% for question in questions %}<article class="bank-row" data-question-id="{{ question.pk }}" data-title="{{ question.display_title }}">
{% if selecting %}<label class="bank-select"><input type="checkbox" value="{{ question.pk }}" data-select-question><span class="visually-hidden">Selecionar {{ question.display_title }}</span></label>{% endif %}
<button type="button" class="bank-row-preview" data-preview="{% url 'assessments:question-preview' question.pk %}"><strong>{{ question.display_title }}</strong><span>{{ question.subject }} · {{ question.topic }} · {{ question.get_question_type_display }}</span><small>{% if question.organization %}{{ question.organization.name }}{% else %}Privada · Minha questão{% endif %} · {{ question.get_creation_method_display }}{% if question.source_key %} · Não revisada{% endif %}{% for skill in question.diagnostic_metadata.skills %} · {{ skill }}{% endfor %}</small></button>
{% if not selecting and question.owner_id == request.user.pk %}<a href="{% url 'assessments:bank-question-update' question.pk %}" class="bank-edit" aria-label="Editar {{ question.display_title }}">Editar</a>{% endif %}
</article>{% empty %}<p class="bank-empty">Nenhuma questão encontrada neste filtro.</p>{% endfor %}
