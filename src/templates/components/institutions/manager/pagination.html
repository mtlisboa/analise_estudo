{% if page.paginator.num_pages > 1 %}<nav class="manager-actions" aria-label="Páginas">
{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}">Anterior</a>{% endif %}
<span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
{% if page.has_next %}<a href="?page={{ page.next_page_number }}">Próxima</a>{% endif %}
</nav>{% endif %}
