{% if page.paginator.num_pages > 1 %}<nav class="manager-actions" aria-label="Paginação">
{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}{% if page_query %}&amp;{{ page_query }}{% endif %}">Anterior</a>{% endif %}
<span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
{% if page.has_next %}<a href="?page={{ page.next_page_number }}{% if page_query %}&amp;{{ page_query }}{% endif %}">Próxima</a>{% endif %}</nav>{% endif %}
