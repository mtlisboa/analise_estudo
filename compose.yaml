
services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: analise-estudo:local
    init: true
    command: >-
      sh -c "exec uvicorn config.asgi:application
      --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-unsafe-compose-development-key}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-True}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      REDIS_URL: redis://redis:6379/0
      SQLITE_PATH: /data/db.sqlite3
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      EMAIL_USE_TLS: "False"
      EMAIL_USE_SSL: "False"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-nao-responda@analise-estudo.test}"
      IA_MCP_SERVER_URL: "${IA_MCP_SERVER_URL:-}"
      IA_MCP_CHAT_TOOL: "${IA_MCP_CHAT_TOOL:-answer_from_documentation}"
      IA_MCP_TIMEOUT_SECONDS: "${IA_MCP_TIMEOUT_SECONDS:-30}"
    depends_on:
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/conta/entrar/', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.4
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mailpit_data:/data
    restart: unless-stopped

volumes:
  mailpit_data:
  sqlite_data:

