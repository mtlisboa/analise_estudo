
services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: analise-estudo:local
    init: true
    command: >-
      sh -c "exec uvicorn config.asgi:application
      --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-unsafe-compose-development-key}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-True}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      REDIS_URL: redis://redis:6379/0
      SQLITE_PATH: /data/db.sqlite3
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      EMAIL_USE_TLS: "False"
      EMAIL_USE_SSL: "False"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-nao-responda@analise-estudo.test}"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:0.5b}"
      OLLAMA_TIMEOUT_SECONDS: "${OLLAMA_TIMEOUT_SECONDS:-180}"
    depends_on:
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/conta/entrar/', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s

  ollama:
    image: "${OLLAMA_IMAGE:-alpine/ollama@sha256:1792cb2cc1b468826119b176a9679cbaab685ee9bd8296633cdcd203ee6d5528}"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  ollama-init:
    image: "${OLLAMA_IMAGE:-alpine/ollama@sha256:1792cb2cc1b468826119b176a9679cbaab685ee9bd8296633cdcd203ee6d5528}"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:0.5b}"
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1 || exec ollama pull "$$OLLAMA_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure:3

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.4
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mailpit_data:/data
    restart: unless-stopped

volumes:
  ollama_data:
  mailpit_data:
  sqlite_data:

