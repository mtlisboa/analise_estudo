
services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: analise-estudo:local
    init: true
    command: >-
      sh -c "python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-unsafe-compose-development-key}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-True}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      SQLITE_PATH: /data/db.sqlite3
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/conta/entrar/', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  sqlite_data:
